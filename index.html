<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Title, description, and canonical come from <Seo> (src/components/Seo.jsx) so each
             route gets its own; static copies here would render as duplicate tags in the
             pre-rendered HTML, since the generator prepends the per-page ones into <head>.
             That prepending also pushes the charset meta above down the document — harmless,
             since GitHub Pages declares the charset in the Content-Type header. -->
        <link rel="icon" href="/favicon.ico" />
        <script>
            // Set the theme before first paint to avoid a flash of the wrong theme.
            // Light by default; dark only if the visitor toggled it before.
            (function () {
                var theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            })();
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
